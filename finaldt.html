<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahe [Batch 10] QR Code Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #00c6ff, #0072ff, #42e695, #3bb2f5);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    overflow: hidden;
    color: #fff;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Heading */
.main-heading {
    font-size: 36px;
    font-weight: 700;
    color: white;
    text-align: center;
    margin-bottom: 25px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    animation: fadeInDown 1.2s ease forwards;
}

@keyframes fadeInDown {
    from {opacity: 0; transform: translateY(-50px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Main Container */
.container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 90%;
    max-width: 1000px;
    padding: 40px;
    background: rgba(255,255,255,0.1);
    border-radius: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.8);}
    to {opacity: 1; transform: scale(1);}
}

/* Input Section */
.input-section {
    flex: 1;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.input-section h1 {
    color: #fff;
    text-align: center;
    font-size: 28px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
}

/* Animated Input */
input[type="text"] {
    padding: 15px 20px;
    font-size: 16px;
    border-radius: 25px;
    border: none;
    outline: none;
    color: #000;
    background: linear-gradient(90deg, #ffffff, #e6f7ff, #ffffff);
    transition: all 0.4s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

input[type="text"]:focus {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255,255,255,0.8);
}

/* Buttons */
button {
    padding: 15px;
    border: none;
    border-radius: 25px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #42e695, #3bb2f5);
    color: #fff;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* QR Section */
.qrcode-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

#qrcode {
    background: #fff;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transform: scale(0.8);
    opacity: 0;
    animation: appear 0.5s forwards;
}

@keyframes appear {
    to { transform: scale(1); opacity: 1;}
}

#downloadBtn {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(90deg, #ff6ec4, #ffb347);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s all;
    display: none;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

#downloadBtn:hover {
    transform: scale(1.1);
}

/* Footer */
footer {
    position: fixed;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-size: 18px;
    color: #fff;
    letter-spacing: 1px;
    animation: fadeInUp 2s ease forwards;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
}

@keyframes fadeInUp {
    from {opacity: 0; transform: translateY(50px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>
<body>

<!-- ✨ Main Heading -->
<div class="main-heading">QR CODE GENERATOR</div>

<div class="container">
    <div class="input-section">
        <h1>Enter Text or URL</h1>
        <input type="text" id="textInput" placeholder="Type here...">
        <button id="generateBtn">Generate QR Code</button>
    </div>
    <div class="qrcode-section">
        <div id="qrcode"></div>
        <button id="downloadBtn">Download QR Code</button>
    </div>
</div>

<footer>
    🌊 Sahe [Batch 10] QR Code Generator 🌊
</footer>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
const textInput = document.getElementById('textInput');
const generateBtn = document.getElementById('generateBtn');
const qrcodeDiv = document.getElementById('qrcode');
const downloadBtn = document.getElementById('downloadBtn');

generateBtn.addEventListener('click', () => {
    const value = textInput.value.trim();
    if(!value) { alert("Please enter text or URL"); return; }

    qrcodeDiv.innerHTML = ""; // Clear old QR
    QRCode.toCanvas(value, { width: 250, color: {dark:"#000", light:"#fff"} }, (err, canvas) => {
        if(err) console.error(err);
        qrcodeDiv.appendChild(canvas);
        qrcodeDiv.style.animation = "appear 0.5s forwards";
        downloadBtn.style.display = "block";
    });
});

downloadBtn.addEventListener('click', () => {
    const canvas = qrcodeDiv.querySelector('canvas');
    if(!canvas) return;
    const link = document.createElement('a');
    link.href = canvas.toDataURL("image/png");
    link.download = "qr-code.png";
    link.click();
});
</script>

</body>
</html>
